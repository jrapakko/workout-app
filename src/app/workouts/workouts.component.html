<div id="all-workouts">
    <ng-container *ngIf="workouts">
    <div class="workout-card-wrapper" *ngFor="let workout of this.workouts; let i=index">
        <app-workout-card
            [workout]="workout"
            (deleteWorkoutEvent)="removeWorkout(i)"
            (saveWorkoutEvent)="updateWorkout(i)"
            (deleteExerciseEvent)="decrementExerciseNum(i)">
        </app-workout-card>
    </div>
    </ng-container>
</div>

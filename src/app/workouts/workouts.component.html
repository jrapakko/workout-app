<div id="all-workouts">
    @if (workouts(); as workouts) {
        @if (workouts.length === 0) {
            <div class="empty-state">
                <h2>You have no workouts yet</h2>
                <p>Create your first workout to get started.</p>
                <button mat-flat-button color="primary" type="button" routerLink="/add-workout">Create workout</button>
            </div>
        } @else {
            @for (workout of workouts; track workout.id; let i = $index) {
                <div class="workout-card-wrapper">
                    <app-workout-card
                        [workout]="workout"
                        (deleteWorkoutEvent)="removeWorkout(i)"
                        (saveWorkoutEvent)="updateWorkout(i)">
                    </app-workout-card>
                </div>
            }
        }
    }
</div>

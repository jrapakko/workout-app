<div id="all-workouts" cdkDropListGroup>
    @if (regimen(); as regimen) {
        <div class="regimen-wrapper">
            <h2>Routine</h2>
            <div id="regimen" class="regimen" cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="drop($event)" >
                @for (workout of regimen.workouts; track workout) {
                    <div class="workout-card-wrapper cdk-drag" cdkDrag >
                        <app-workout-card [workout]="workout" [regimen]="true" [user]="user()"></app-workout-card>
                    </div>
                }
                @if (regimen.workouts.length === 0) {
                    <div class="workout-card-placeholder" cdkDragPlaceholder>
                        <mat-card>
                            <mat-card-header class="exercise-list-header">
                                <h2>Placeholder</h2>
                            </mat-card-header>
            
                            <mat-card-content>
                                <p class="light workout-card-placeholder-text">Drag and drop workouts here to create a regimen.</p>
                            </mat-card-content>
                        </mat-card>
                    </div>
                }
            </div>
        </div>
    }
    @if (workouts(); as workouts) {
    <div class="regimen-wrapper">
        <h2>Workouts</h2>
        <div id="workouts" class="workouts" cdkDropList cdkDropListOrientation="horizontal" (cdkDropListDropped)="drop($event)" >
            @for (workout of workouts; track workout.id) {
                <div class="workout-card-wrapper cdk-drag" cdkDrag>
                    <app-workout-card [workout]="workout" [regimen]="true" [user]="user()"></app-workout-card>
                </div>
            }
        </div>
    </div>
    }
</div>

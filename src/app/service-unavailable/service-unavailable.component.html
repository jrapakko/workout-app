<div class="offline-wrapper">
  <div class="offline-card">
    <div class="icon-container">
      <div class="pulse-ring"></div>
      <div class="pulse-ring-outer"></div>
      <svg class="warning-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 9V14M12 17.01L12.01 16.998M12 3L2 21H22L12 3Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    
    <h1 class="offline-title">Connection Interrupted</h1>
    <p class="offline-subtitle">
      We couldn't set up your workout workspace. This usually happens when the backend database is offline or restarting.
    </p>
    
    <button class="retry-button" [disabled]="isRetrying()" (click)="retry()">
      @if (isRetrying()) {
        <span class="spinner"></span>
        Reconnecting...
      } @else {
        <svg class="button-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l.73-.73" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Retry Connection
      }
    </button>
  </div>
</div>

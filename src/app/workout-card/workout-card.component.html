
<div *ngIf="dashboard; then workoutDash else workoutCard"></div>


    <ng-template #workoutDash>

        <mat-card class="exercise-card-dash">
            <mat-card-header class="exercise-list-header">
                <h2>{{workout.name}}</h2>
            </mat-card-header>

            <mat-card-content>
                <ul class="exercise-list">
                    <li class="exercise-card table-row" *ngFor="let exercise of workout.exercises">
                        <div class="exercise-name exercise-name-dash row-item"><b>{{exercise.name}}</b></div>
                        <div class="exercise-sets row-item">Sets: {{exercise.sets}}</div>
                        <div class="exercise-reps row-item">Reps: {{exercise.reps}}</div>
                        <div class="exercise-prev-reps row-item">Previous Weight: {{exercise.previousWeight}}</div>
                        <div class="exercise-curr exercise-dash-sub-row row-sub-container">
                            <div *ngFor="let set of exercise.cur_sets" class="form-group">
                                <div class="row-item">
                                    <label for="weight">Weight: </label>
                                    <input id="weight" type="number" class="form-control"
                                            [(ngModel)]="set.weight" name="weight">
                                </div>
                                <div class="row-item">
                                    <label for="reps">Reps: </label>
                                    <input id="reps" type="number" class="form-control"
                                            [(ngModel)]="set.reps" name="reps">
                                </div>
                            </div>
                            <button type="button" class="btn btn-primary btn-lg row-item" (click)="log();">Save Sets</button>
                        </div>
                    </li>
                </ul>
            </mat-card-content>

            <mat-card-actions class="exercise-list-footer">
            </mat-card-actions>

        </mat-card>

    </ng-template>


    <ng-template #workoutCard>

    <div *ngIf="edit; then workoutEdit else workoutDisp"></div>

        <ng-template #workoutEdit>
            <mat-card>
                <mat-card-header class="exercise-list-header">
                    <h2>{{workout.name}}</h2>
                </mat-card-header>

                <mat-card-content>
                    <ul class="exercise-list">
                        <li class="exercise-card table-row" *ngFor="let exercise of workout.exercises; let i=index">
                            <div class="exercise-name row-item">
                                <input id="exercise-name"
                                    type="text" class="form-control"
                                    [(ngModel)]="exercise.name" name="exercise-name">
                            </div>
                            <div class="exercise-sets-reps-sub-row row-sub-container">
                                <div class="exercise-sets row-item">
                                    <label for="sets">Sets: </label>
                                    <input id="sets" type="number" class="form-control"
                                    [(ngModel)]="exercise.sets" name="sets">
                                </div>
                                <div class="exercise-reps row-item">
                                    <label for="reps">Reps: </label>
                                    <input id="reps" type="number" class="form-control"
                                    [(ngModel)]="exercise.reps" name="reps">
                                </div>
                                <button (click)="removeExercise(i)">Remove Exercise</button>
                            </div>
                        </li>
                    </ul>
                </mat-card-content>

                <mat-card-actions class="exercise-list-footer">
                    <div><button (click)="saveWorkout()">Save Changes</button></div>
                    <div><button (click)="deleteWorkout()">Remove Workout</button></div>
                </mat-card-actions>

            </mat-card>
        </ng-template>

        <ng-template #workoutDisp>
            <mat-card>
                <mat-card-header class="exercise-list-header">
                    <h2>{{workout.name}}</h2>
                </mat-card-header>

                <mat-card-content>
                    <ul class="exercise-list">
                        <li class="exercise-card table-row" *ngFor="let exercise of workout.exercises">
                            <div class="exercise-name row-item"><b>{{exercise.name}}</b></div>
                            <div class="exercise-sets row-item">Sets: {{exercise.sets}}</div>
                            <div class="exercise-reps row-item">Reps: {{exercise.reps}}</div>
                        </li>
                    </ul>
                </mat-card-content>

                <mat-card-actions class="exercise-list-footer">
                    <div *ngIf="!(regimen)"><button (click)="toggleEdit()">Edit</button></div>
                </mat-card-actions>

            </mat-card>
        </ng-template>
        
    </ng-template>
